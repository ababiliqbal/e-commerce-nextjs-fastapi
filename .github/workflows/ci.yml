name: CI Pipeline

on:
  push:
    branches:
      - main
      - chore/docker-cicd
  pull_request:
    branches:
      - main
      - chore/docker-cicd

jobs:
  backend-ci:
    name: Backend CI (FastAPI & Python Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax (compile check)
        run: python -m py_compile main.py models.py schemas.py database.py seed.py

      - name: Validate FastAPI import (smoke test)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -c "import main; assert main.app is not None"

  frontend-ci:
    name: Frontend CI (Next.js Type Check & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js Route Types & TypeScript Check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-dummy-ci"
        run: npm run build
